<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koperasi Kelurahan Marunda Center | Berita, Wawasan & Katalog Produk</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
            theme: {
                extend: {
                    colors: {
                        primary: '#2f00ff',
                        'primary-dark': '#1e00aa',
                        secondary: '#f2f2f2',
                        tertiary: '#000000',
                        darkNeutral: '#110f1a',
                        lightNeutral: '#f4f3f6',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Three.js for 3D Cinematic Hero -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <!-- Lenis for Smooth Scrolling -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #f4f3f6;
            --surface-color: #ffffff;
            --text-color: #110f1a;
            --text-muted: #5a5766;
            --border-color: rgba(0, 0, 0, 0.1);
            --card-bg: #ffffff;
            --accent-glow: rgba(47, 0, 255, 0.15);
        }

        [data-theme="dark"] {
            --bg-color: #110f1a;
            --surface-color: #1a1726;
            --text-color: #f4f3f6;
            --text-muted: #aba8ba;
            --border-color: rgba(255, 255, 255, 0.1);
            --card-bg: #1a1726;
            --accent-glow: rgba(47, 0, 255, 0.35);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        .glass-nav {
            background-color: var(--surface-color);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
        }

        .card-custom {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
        }

        .card-custom:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px var(--accent-glow);
        }

        .article-measure {
            max-width: 68ch;
            margin-left: auto;
            margin-right: auto;
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: #2f00ff;
            border-radius: 4px;
        }
    </style>
</head>
<body class="antialiased selection:bg-primary selection:text-white">

    <header class="fixed top-0 left-0 right-0 z-50 glass-nav">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="router.navigate('home')">
                <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center text-white font-bold text-xl shadow-lg">
                    KM
                </div>
                <div>
                    <span class="font-bold text-lg tracking-tight block leading-none">Koperasi Marunda</span>
                    <span class="text-xs text-primary font-medium tracking-widest uppercase">Center</span>
                </div>
            </div>

            <nav class="hidden md:flex items-center space-x-8 text-sm font-medium">
                <button onclick="router.navigate('home')" class="hover:text-primary transition-colors">Beranda</button>
                <button onclick="router.navigate('blog')" class="hover:text-primary transition-colors">Artikel & Berita</button>
                <button onclick="router.navigate('catalog')" class="hover:text-primary transition-colors">Katalog Produk</button>
                <button onclick="router.navigate('about')" class="hover:text-primary transition-colors">Tentang Kami</button>
            </nav>

            <div class="flex items-center space-x-4">
                <!-- Theme Toggle Button -->
                <button id="themeToggle" aria-label="Toggle Theme" class="w-10 h-10 rounded-full flex items-center justify-center border border-[var(--border-color)] bg-[var(--surface-color)] hover:border-primary transition-all">
                    <i class="fa-solid fa-moon dark:hidden text-gray-800"></i>
                    <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
                </button>

                <!-- Admin Dashboard Trigger -->
                <button onclick="openAdminModal()" class="hidden sm:inline-flex items-center space-x-2 px-4 py-2 rounded-xl bg-primary text-white font-medium text-sm hover:bg-primary-dark transition-colors shadow-md">
                    <i class="fa-solid fa-gauge-high"></i>
                    <span>Admin Panel</span>
                </button>

                <!-- Mobile menu button -->
                <button id="mobileMenuBtn" class="md:hidden w-10 h-10 rounded-xl flex items-center justify-center border border-[var(--border-color)]">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Menu Dropdown -->
        <div id="mobileMenu" class="hidden md:hidden px-6 py-4 glass-nav border-t border-[var(--border-color)] space-y-3">
            <button onclick="router.navigate('home'); toggleMobileMenu();" class="block w-full text-left py-2 font-medium">Beranda</button>
            <button onclick="router.navigate('blog'); toggleMobileMenu();" class="block w-full text-left py-2 font-medium">Artikel & Berita</button>
            <button onclick="router.navigate('catalog'); toggleMobileMenu();" class="block w-full text-left py-2 font-medium">Katalog Produk</button>
            <button onclick="router.navigate('about'); toggleMobileMenu();" class="block w-full text-left py-2 font-medium">Tentang Kami</button>
            <button onclick="openAdminModal(); toggleMobileMenu();" class="block w-full text-left py-2 font-medium text-primary">Admin Panel</button>
        </div>
    </header>

    <main id="app" class="pt-20">
        <!-- Views will be dynamically injected here -->
    </main>

    <div id="adminModal" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="card-custom w-full max-w-4xl max-h-[90vh] rounded-2xl overflow-hidden flex flex-col shadow-2xl">
            <div class="px-6 py-4 border-b border-[var(--border-color)] flex items-center justify-between bg-[var(--surface-color)]">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-lg bg-primary/20 text-primary flex items-center justify-center">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <h3 class="font-bold text-lg">Admin Management - Koperasi Marunda</h3>
                </div>
                <button onclick="closeAdminModal()" class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-gray-500/20">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="flex border-b border-[var(--border-color)] px-6 bg-[var(--surface-color)] space-x-6 text-sm font-medium">
                <button onclick="switchAdminTab('posts')" id="tabPostsBtn" class="py-3 border-b-2 border-primary text-primary">Kelola Artikel</button>
                <button onclick="switchAdminTab('products')" id="tabProductsBtn" class="py-3 border-b-2 border-transparent text-[var(--text-muted)]">Kelola Produk</button>
                <button onclick="switchAdminTab('createPost')" id="tabCreatePostBtn" class="py-3 border-b-2 border-transparent text-[var(--text-muted)]">+ Tulis Artikel Baru</button>
            </div>

            <div class="p-6 overflow-y-auto flex-1 space-y-6">
                <!-- Posts Tab -->
                <div id="adminPostsView" class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h4 class="font-semibold text-base">Daftar Artikel & Berita</h4>
                        <button onclick="switchAdminTab('createPost')" class="px-3 py-1.5 rounded-lg bg-primary text-white text-xs font-medium">Buat Baru</button>
                    </div>
                    <div id="adminPostsList" class="space-y-3">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Products Tab -->
                <div id="adminProductsView" class="hidden space-y-4">
                    <div class="flex justify-between items-center">
                        <h4 class="font-semibold text-base">Katalog Produk Koperasi</h4>
                        <button onclick="openProductModal()" class="px-3 py-1.5 rounded-lg bg-primary text-white text-xs font-medium">+ Tambah Produk</button>
                    </div>
                    <div id="adminProductsList" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Create/Edit Post Tab -->
                <div id="adminCreatePostView" class="hidden space-y-4">
                    <h4 class="font-semibold text-base" id="postFormTitle">Tulis Artikel / Berita Baru</h4>
                    <form id="postForm" onsubmit="handlePostSubmit(event)" class="space-y-4">
                        <input type="hidden" id="editPostId">
                        <div>
                            <label class="block text-xs font-medium uppercase tracking-wider mb-1">Judul Artikel</label>
                            <input type="text" id="postTitleInput" required class="w-full px-4 py-2.5 rounded-xl border border-[var(--border-color)] bg-[var(--bg-color)] focus:border-primary outline-none">
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-medium uppercase tracking-wider mb-1">Kategori</label>
                                <select id="postCategoryInput" class="w-full px-4 py-2.5 rounded-xl border border-[var(--border-color)] bg-[var(--bg-color)] focus:border-primary outline-none">
                                    <option value="Berita Koperasi">Berita Koperasi</option>
                                    <option value="UMKM & Wirausaha">UMKM & Wirausaha</option>
                                    <option value="Pemberdayaan Warga">Pemberdayaan Warga</option>
                                    <option value="Teknologi & Digital">Teknologi & Digital</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium uppercase tracking-wider mb-1">Status Publikasi</label>
                                <select id="postStatusInput" class="w-full px-4 py-2.5 rounded-xl border border-[var(--border-color)] bg-[var(--bg-color)] focus:border-primary outline-none">
                                    <option value="Published">Publish Langsung</option>
                                    <option value="Draft">Simpan Draft</option>
                                    <option value="Scheduled">Jadwalkan Terbit</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-medium uppercase tracking-wider mb-1">URL Gambar Utama</label>
                            <input type="url" id="postImageInput" placeholder="https://images.unsplash.com/..." required class="w-full px-4 py-2.5 rounded-xl border border-[var(--border-color)] bg-[var(--bg-color)] focus:border-primary outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium uppercase tracking-wider mb-1">Ringkasan Singkat (Excerpt)</label>
                            <textarea id="postExcerptInput" rows="2" required class="w-full px-4 py-2.5 rounded-xl border border-[var(--border-color)] bg-[var(--bg-color)] focus:border-primary outline-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-medium uppercase tracking-wider mb-1">Konten Lengkap (mendukung Markdown / HTML sederhana)</label>
                            <textarea id="postContentInput" rows="6" required class="w-full px-4 py-2.5 rounded-xl border border-[var(--border-color)] bg-[var(--bg-color)] focus:border-primary outline-none"></textarea>
                        </div>
                        <div class="flex justify-end space-x-3 pt-2">
                            <button type="button" onclick="switchAdminTab('posts')" class="px-5 py-2.5 rounded-xl border border-[var(--border-color)] text-sm font-medium">Batal</button>
                            <button type="submit" class="px-6 py-2.5 rounded-xl bg-primary text-white text-sm font-medium hover:bg-primary-dark transition-colors">Simpan Artikel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Product Add/Edit Modal -->
    <div id="productModal" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="card-custom w-full max-w-lg rounded-2xl overflow-hidden flex flex-col shadow-2xl p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-[var(--border-color)] pb-3">
                <h3 class="font-bold text-lg">Tambah / Edit Produk Koperasi</h3>
                <button onclick="closeProductModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="productForm" onsubmit="handleProductSubmit(event)" class="space-y-4">
                <input type="hidden" id="editProductId">
                <div>
                    <label class="block text-xs font-medium uppercase tracking-wider mb-1">Nama Produk</label>
                    <input type="text" id="prodNameInput" required class="w-full px-4 py-2.5 rounded-xl border border-[var(--border-color)] bg-[var(--bg-color)] outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium uppercase tracking-wider mb-1">Harga (Rp)</label>
                        <input type="number" id="prodPriceInput" required class="w-full px-4 py-2.5 rounded-xl border border-[var(--border-color)] bg-[var(--bg-color)] outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium uppercase tracking-wider mb-1">Kategori</label>
                        <input type="text" id="prodCategoryInput" required class="w-full px-4 py-2.5 rounded-xl border border-[var(--border-color)] bg-[var(--bg-color)] outline-none" placeholder="Sembako / Kerajinan / Jasa">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium uppercase tracking-wider mb-1">URL Gambar</label>
                    <input type="url" id="prodImageInput" required class="w-full px-4 py-2.5 rounded-xl border border-[var(--border-color)] bg-[var(--bg-color)] outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium uppercase tracking-wider mb-1">Deskripsi Produk</label>
                    <textarea id="prodDescInput" rows="3" required class="w-full px-4 py-2.5 rounded-xl border border-[var(--border-color)] bg-[var(--bg-color)] outline-none"></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeProductModal()" class="px-4 py-2 rounded-xl border border-[var(--border-color)]">Batal</button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-primary text-white">Simpan Produk</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Smooth scroll initialization with Lenis
        const lenis = new Lenis({
            duration: 1.2,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            direction: 'vertical',
            smooth: true,
        });

        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        // Mock Database (State)
        let state = {
            theme: localStorage.getItem('theme') || 'dark',
            currentRoute: 'home',
            currentParams: null,
            searchQuery: '',
            selectedCategory: 'All',
            posts: [
                {
                    id: 1,
                    title: "Peresmian Program Digitalisasi Warung Warga Marunda Center 2026",
                    slug: "digitalisasi-warung-warga-marunda-2026",
                    category: "Teknologi & Digital",
                    excerpt: "Koperasi Kelurahan Marunda Center meluncurkan aplikasi kasir digital dan QRIS massal untuk seluruh warung kelontong anggota.",
                    content: `Koperasi Kelurahan Marunda Center dengan bangga mengumumkan peluncuran program 'Digitalisasi Warung Warga' yang dirancang khusus untuk meningkatkan daya saing UMKM lokal di era modern. Dalam program ini, setiap anggota koperasi pemilik warung kelontong akan mendapatkan pendampingan penggunaan sistem pencatatan keuangan berbasis cloud, integrasi pembayaran QRIS, serta akses modal mikro berbunga rendah.\n\nKetua Koperasi Marunda Center menyampaikan bahwa transformasi digital bukan lagi pilihan, melainkan keharusan. "Dengan sistem yang terintegrasi, efisiensi operasional warung meningkat hingga 40% dan memudahkan akses terhadap pasokan barang grosir langsung dari pusat koperasi," ujarnya.\n\nProgram ini menargetkan lebih dari 150 warung di kawasan Kelurahan Marunda hingga akhir kuartal ketiga tahun 2026. Mari dukung terus produk dan warung tetangga kita!`,
                    author: {
                        name: "Budi Santoso, S.E.",
                        role: "Ketua Pengurus Koperasi",
                        avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80"
                    },
                    publishedAt: "12 Okt 2026",
                    updatedAt: "14 Okt 2026",
                    readTime: "4 min read",
                    image: "https://images.unsplash.com/photo-1542838132-92c53300491e?w=1200&auto=format&fit=crop&q=80",
                    status: "Published"
                },
                {
                    id: 2,
                    title: "Pelatihan Keterampilan Pengolahan Limbah Kreatif untuk Pemuda Karang Taruna",
                    slug: "pelatihan-limbah-kreatif-karang-taruna",
                    category: "Pemberdayaan Warga",
                    excerpt: "Mengubah barang bekas bernilai rendah menjadi produk kerajinan tangan bernilai ekspor hasil kolaborasi Koperasi dan Karang Taruna.",
                    content: `Bertempat di Balai Warga Marunda Center, Koperasi bersama Karang Taruna setempat mengadakan workshop intensif selama tiga hari mengenai teknik daur ulang dan desain produk kerajinan tangan.\n\nKegiatan ini menghadirkan praktisi desain ramah lingkungan yang mengajarkan cara mengolah botol plastik, kain perca, dan kardus bekas menjadi dekorasi rumah serta tas modis yang bernilai jual tinggi. Seluruh hasil karya terbaik akan dipasarkan melalui Katalog Resmi Koperasi Marunda Center dan dipamerkan pada event bazar tingkat kota mendatang.`,
                    author: {
                        name: "Siti Rahmawati, M.Pd.",
                        role: "Divisi Pemberdayaan Anggota",
                        avatar: "https://images.unsplash.com/photo-1580489944761-15a19d654956?w=150&auto=format&fit=crop&q=80"
                    },
                    publishedAt: "08 Okt 2026",
                    updatedAt: "08 Okt 2026",
                    readTime: "3 min read",
                    image: "https://images.unsplash.com/photo-1532996122724-e3c354a0b15b?w=1200&auto=format&fit=crop&q=80",
                    status: "Published"
                },
                {
                    id: 3,
                    title: "Laporan Tahunan Koperasi Marunda Center: Pertumbuhan SHU Meningkat 25%",
                    slug: "laporan-tahunan-koperasi-marunda-center-2026",
                    category: "Berita Koperasi",
                    excerpt: "Rapat Anggota Tahunan (RAT) mencatatkan rekor surplus usaha tertinggi sepanjang sejarah pendirian koperasi.",
                    content: `Koperasi Kelurahan Marunda Center sukses menyelenggarakan Rapat Anggota Tahunan (RAT) Tahun Buku 2025 dengan mencatatkan pencapaian luar biasa. Sisa Hasil Usaha (SHU) mengalami lonjakan sebesar 25% dibanding tahun sebelumnya.\n\nKeberhasilan ini didorong oleh ekspansi unit usaha simpan pinjam yang sehat, unit grosir sembako murah, serta suksesnya unit layanan logistik kelurahan. Pengurus berkomitmen untuk terus transparan dan meningkatkan deviden serta kesejahteraan seluruh anggota aktif.`,
                    author: {
                        name: "Ahmad Fauzi, Ak.",
                        role: "Kepala Badan Pengawas",
                        avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80"
                    },
                    publishedAt: "01 Okt 2026",
                    updatedAt: "02 Okt 2026",
                    readTime: "5 min read",
                    image: "https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=1200&auto=format&fit=crop&q=80",
                    status: "Published"
                }
            ],
            products: [
                {
                    id: 1,
                    name: "Beras Organik Sejahtera 5kg",
                    category: "Sembako",
                    price: 68000,
                    image: "https://images.unsplash.com/photo-1586201375761-83865001e31c?w=600&auto=format&fit=crop&q=80",
                    description: "Beras pilihan kualitas premium hasil petani binaan koperasi, pulen dan tanpa pemutih buatan."
                },
                {
                    id: 2,
                    name: "Minyak Goreng Sawit Murni 2L",
                    category: "Sembako",
                    price: 34000,
                    image: "https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=600&auto=format&fit=crop&q=80",
                    description: "Minyak goreng jernih kaya vitamin A untuk kebutuhan memasak harga khusus anggota."
                },
                {
                    id: 3,
                    name: "Tas Daur Ulang Kain Perca Eksklusif",
                    category: "Kerajinan",
                    price: 45000,
                    image: "https://images.unsplash.com/photo-1544816155-12df9643f363?w=600&auto=format&fit=crop&q=80",
                    description: "Tas ramah lingkungan hasil karya pemuda Karang Taruna Marunda Center."
                },
                {
                    id: 4,
                    name: "Paket Sembako Hemat Bulanan",
                    category: "Paket Khusus",
                    price: 150000,
                    image: "https://images.unsplash.com/photo-1553530666-ba11a7da3888?w=600&auto=format&fit=crop&q=80",
                    description: "Terdiri dari beras 5kg, minyak 2L, gula pasir 1kg, dan teh celup pilihan."
                }
            ]
        };

        // Theme Initialization & Toggle
        const htmlEl = document.documentElement;
        const themeToggleBtn = document.getElementById('themeToggle');

        function setTheme(theme) {
            state.theme = theme;
            htmlEl.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        }

        themeToggleBtn.addEventListener('click', () => {
            setTheme(state.theme === 'dark' ? 'light' : 'dark');
        });

        setTheme(state.theme);

        // Mobile menu toggle
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        function toggleMobileMenu() {
            mobileMenu.classList.toggle('hidden');
        }
        mobileMenuBtn.addEventListener('click', toggleMobileMenu);

        // Router System
        const router = {
            navigate: (view, params = null) => {
                state.currentRoute = view;
                state.currentParams = params;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                renderView();
            }
        };

        function renderView() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (state.currentRoute === 'home') {
                app.innerHTML = renderHomeView();
                initThreeHero();
            } else if (state.currentRoute === 'blog') {
                app.innerHTML = renderBlogView();
            } else if (state.currentRoute === 'catalog') {
                app.innerHTML = renderCatalogView();

                            <p class="text-xs text-primary font-semibold mt-2">Email: admin@koperasimarunda.id</p>
                        </div>
                    </div>
                    <div class="max-w-7xl mx-auto pt-8 border-t border-[var(--border-color)] flex flex-col sm:flex-row items-center justify-between text-xs text-[var(--text-muted)]">
                        <p>&copy; 2026 Koperasi Kelurahan Marunda Center. Hak Cipta Dilindungi.</p>
                        <p class="mt-2 sm:mt-0">Ditenagai oleh Standar Web Modern & Teknologi Koperasi Digital.</p>
                    </div>
                </footer>
            `;
        }

        function initThreeHero() {
            const container = document.getElementById('webgl-container');
            if (!container) return;
            container.innerHTML = '';

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Particle Geometry
            const particlesCount = 800;
            const posArray = new Float32Array(particlesCount * 3);

            for(let i = 0; i < particlesCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 15;
            }

            const particlesGeo = new THREE.BufferGeometry();
            particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

            const particlesMat = new THREE.PointsMaterial({
                size: 0.04,
                color: 0x2f00ff,
                transparent: true,
                opacity: 0.8
            });

            const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
            scene.add(particlesMesh);

            camera.position.z = 5;

            // Mouse interaction
            let mouseX = 0;
            let mouseY = 0;

            window.addEventListener('mousemove', (event) => {
                mouseX = event.clientX / window.innerWidth - 0.5;
                mouseY = event.clientY / window.innerHeight - 0.5;
            });

            // Animation Loop
            function animate() {
                requestAnimationFrame(animate);
                particlesMesh.rotation.y += 0.001 + mouseX * 0.05;
                particlesMesh.rotation.x += 0.0005 + mouseY * 0.05;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // --- ADMIN PANEL & INTERACTION LOGIC ---
        function openAdminModal() {
            document.getElementById('adminModal').classList.remove('hidden');
            renderAdminPosts();
            renderAdminProducts();
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        function switchAdminTab(tab) {
            document.getElementById('adminPostsView').classList.add('hidden');
            document.getElementById('adminProductsView').classList.add('hidden');
            document.getElementById('adminCreatePostView').classList.add('hidden');
            
            document.getElementById('tabPostsBtn').className = "py-3 border-b-2 border-transparent text-[var(--text-muted)]";
            document.getElementById('tabProductsBtn').className = "py-3 border-b-2 border-transparent text-[var(--text-muted)]";
            document.getElementById('tabCreatePostBtn').className = "py-3 border-b-2 border-transparent text-[var(--text-muted)]";

            if (tab === 'posts') {
                document.getElementById('adminPostsView').classList.remove('hidden');
                document.getElementById('tabPostsBtn').className = "py-3 border-b-2 border-primary text-primary font-semibold";
            } else if (tab === 'products') {
                document.getElementById('adminProductsView').classList.remove('hidden');
                document.getElementById('tabProductsBtn').className = "py-3 border-b-2 border-primary text-primary font-semibold";
            } else if (tab === 'createPost') {
                document.getElementById('adminCreatePostView').classList.remove('hidden');
                document.getElementById('tabCreatePostBtn').className = "py-3 border-b-2 border-primary text-primary font-semibold";
                document.getElementById('postForm').reset();
                document.getElementById('editPostId').value = '';
                document.getElementById('postFormTitle').innerText = 'Tulis Artikel / Berita Baru';
            }
        }

        function renderAdminPosts() {
            const listEl = document.getElementById('adminPostsList');
            listEl.innerHTML = state.posts.map(p => `
                <div class="flex items-center justify-between p-4 rounded-xl border border-[var(--border-color)] bg-[var(--surface-color)]">
                    <div class="flex items-center space-x-3">
                        <img src="${p.image}" class="w-12 h-12 rounded-lg object-cover">
                        <div>
                            <h5 class="font-bold text-sm line-clamp-1">${p.title}</h5>
                            <span class="text-[10px] text-[var(--text-muted)]">${p.category} • Status: <strong class="text-primary">${p.status}</strong></span>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="editPost(${p.id})" class="px-3 py-1.5 rounded-lg border border-[var(--border-color)] text-xs hover:border-primary">Edit</button>
                        <button onclick="deletePost(${p.id})" class="px-3 py-1.5 rounded-lg bg-red-500/10 text-red-500 text-xs">Hapus</button>
                    </div>
                </div>
            `).join('');
        }

        function renderAdminProducts() {
            const listEl = document.getElementById('adminProductsList');
            listEl.innerHTML = state.products.map(prod => `
                <div class="flex items-center justify-between p-3 rounded-xl border border-[var(--border-color)] bg-[var(--surface-color)]">
                    <div class="flex items-center space-x-3">
                        <img src="${prod.image}" class="w-10 h-10 rounded-lg object-cover">
                        <div>
                            <h5 class="font-bold text-xs line-clamp-1">${prod.name}</h5>
                            <span class="text-[10px] text-primary font-semibold">Rp ${prod.price.toLocaleString('id-ID')}</span>
                        </div>
                    </div>
                    <button onclick="deleteProduct(${prod.id})" class="text-red-500 text-xs px-2 py-1"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function handlePostSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('editPostId').value;
            const title = document.getElementById('postTitleInput').value;
            const category = document.getElementById('postCategoryInput').value;
            const status = document.getElementById('postStatusInput').value;
            const image = document.getElementById('postImageInput').value;
            const excerpt = document.getElementById('postExcerptInput').value;
            const content = document.getElementById('postContentInput').value;

            if (id) {
                // Edit
                const post = state.posts.find(p => p.id == id);
                if (post) {
                    post.title = title;
                    post.category = category;
                    post.status = status;
                    post.image = image;
                    post.excerpt = excerpt;
                    post.content = content;
                    post.updatedAt = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
                }
            } else {
                // Create
                const newPost = {
                    id: Date.now(),
                    title,
                    slug: title.toLowerCase().replace(/[^a-z0-9]/g, '-'),
                    category,
                    excerpt,
                    content,
                    author: {
                        name: "Budi Santoso, S.E.",
                        role: "Ketua Pengurus Koperasi",
                        avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80"
                    },
                    publishedAt: new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }),
                    updatedAt: new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }),
                    readTime: "3 min read",
                    image,
                    status
                };
                state.posts.unshift(newPost);
            }

            switchAdminTab('posts');
            renderAdminPosts();
            renderView();
        }

        function editPost(id) {
            const post = state.posts.find(p => p.id === id);
            if (!post) return;
            switchAdminTab('createPost');
            document.getElementById('editPostId').value = post.id;
            document.getElementById('postTitleInput').value = post.title;
            document.getElementById('postCategoryInput').value = post.category;
            document.getElementById('postStatusInput').value = post.status;
            document.getElementById('postImageInput').value = post.image;
            document.getElementById('postExcerptInput').value = post.excerpt;
            document.getElementById('postContentInput').value = post.content;
            document.getElementById('postFormTitle').innerText = 'Edit Artikel / Berita';
        }

        function deletePost(id) {
            state.posts = state.posts.filter(p => p.id !== id);
            renderAdminPosts();
            renderView();
        }

        // Product Modal Functions
        function openProductModal() {
            document.getElementById('productModal').classList.remove('hidden');
        }
        function closeProductModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        function handleProductSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('prodNameInput').value;
            const price = Number(document.getElementById('prodPriceInput').value);
            const category = document.getElementById('prodCategoryInput').value;
            const image = document.getElementById('prodImageInput').value;
            const description = document.getElementById('prodDescInput').value;

            const newProd = {
                id: Date.now(),
                name,
                price,
                category,
                image,
                description
            };
            state.products.unshift(newProd);
            closeProductModal();
            renderAdminProducts();
            renderView();
        }

        function deleteProduct(id) {
            state.products = state.products.filter(p => p.id !== id);
            renderAdminProducts();
            renderView();
        }

        function orderProduct(prodName) {
            const msg = encodeURIComponent(`Halo Koperasi Marunda Center, saya ingin memesan produk: *${prodName}*. Mohon informasi ketersediaan dan pengirimannya.`);
            window.open(`https://wa.me/6281234567890?text=${msg}`, '_blank');
        }

        function handleSearchInput(e) {
            state.searchQuery = e.target.value;
            renderView();
        }

        function selectCategory(cat) {
            state.selectedCategory = cat;
            if (state.currentRoute !== 'blog') {
                router.navigate('blog');
            } else {
                renderView();
            }
        }

        // Initial render
        renderView();
    </script>
